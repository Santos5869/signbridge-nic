<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <title>SignBridge | ¿Qué significa esta seña?</title>

    <link rel="stylesheet" href="../css/juegos.css">
    <!-- Sistema de diseño común (va al final para unificar estilos) -->
    <link rel="stylesheet" href="../css/slush.css">
</head>

<body class="juego-quiz">

    <main class="juego">

        <!-- BARRA SUPERIOR -->

        <header class="topbar">

            <a
                href="presentaciones-cursos.html"
                class="pill"
            >
                ← Presentaciones
            </a>

            <span class="pill acento">
                🧠 Quiz
            </span>

        </header>


        <!-- ENCABEZADO -->

        <section class="cabecera">

            <span class="sticker violet" aria-hidden="true">🤟</span>
            <span class="sticker sun" aria-hidden="true">⭐</span>

            <h1>¿Qué significa?</h1>

            <p>
                Mira la seña y elige su significado.
                Cada acierto seguido aumenta tu racha.
            </p>

        </section>


        <!-- JUEGO -->

        <section
            class="tarjeta"
            aria-live="polite"
        >

            <div class="marcador">

                <span
                    id="ronda"
                    class="pill"
                >
                    Pregunta 1 / 10
                </span>

                <div class="grupo">

                    <span
                        id="racha"
                        class="pill"
                    >
                        🔥 0
                    </span>

                    <span
                        id="puntos"
                        class="pill acento"
                    >
                        ⭐ 0 pts
                    </span>

                </div>

            </div>

            <div class="barra">
                <span id="barra"></span>
            </div>

            <div
                id="sena"
                class="sena-marco"
            ></div>

            <div
                id="opciones"
                class="opciones"
            ></div>

            <p
                id="mensaje"
                class="mensaje"
            ></p>

            <div class="acciones">

                <button
                    id="siguiente"
                    class="btn hidden"
                    type="button"
                >
                    Siguiente →
                </button>

            </div>

        </section>

    </main>


    <!-- FINAL -->

    <div
        id="final"
        class="final hidden"
        role="dialog"
        aria-modal="true"
    >

        <div class="final-tarjeta">

            <span class="sticker mint" aria-hidden="true">🎉</span>

            <h2>¡Quiz terminado!</h2>

            <div
                id="estrellas"
                class="final-estrellas"
            ></div>

            <p id="finalTexto"></p>

            <div
                id="repasar"
                class="repasar hidden"
            ></div>

            <div class="acciones">

                <button
                    id="otraVez"
                    class="btn"
                    type="button"
                >
                    Jugar otra vez
                </button>

                <a
                    href="presentaciones-cursos.html"
                    class="btn fantasma"
                >
                    Volver
                </a>

            </div>

        </div>

    </div>


    <script src="../js/abc-comun.js"></script>
    <script src="../js/presentaciones-juegos.js"></script>
    <script src="../js/juego-quiz.js"></script>
    <script src="../js/fluidez.js"></script>

</body>

</html>
